<!doctype html>
<html lang="en" data-mode="light">
<head>
  
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybreak Planner</title>
<meta name="description" content="Turn a task summary into a timed daily schedule with reminders, notes for every day and tick sounds.">
<meta id="themeMeta" name="theme-color" content="#F2F4F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybreak">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3428065384019347"
     crossorigin="anonymous"></script>
  
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22a11 11 0 0 1 22 0z" fill="currentColor"/><path d="M2 26h28" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M16 4v4M5.5 9.5l2.8 2.8M26.5 9.5l-2.8 2.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>Daybreak</span>
    </div>
    <button type="button" id="guideBtn" class="btn quiet small">Guide</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  <main id="main" class="main"></main>
</div>
<div id="drawer" class="drawer" role="button" tabindex="0" aria-label="Note for this day. Drag up or tap to open."><span class="grip"></span></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="banners" class="banners" aria-live="assertive"></div>
<noscript>Daybreak Planner needs JavaScript to run.</noscript>
<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
